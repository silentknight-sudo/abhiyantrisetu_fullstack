name: Build Android APK

# Builds installable APKs of the customer app and the partner app on GitHub's machines,
# with no Expo account needed. Start it from the Actions tab ("Run workflow"), or push a
# tag such as v1.0.0 to also attach both APKs to a GitHub Release.
#
# Signing: with the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
# and ANDROID_KEY_PASSWORD repository secrets set, APKs are signed with your release key
# (every later update must use the same key). Without them they are signed with the
# debug key: fine for testing on phones, not for the Play Store.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Which app to build
        type: choice
        options: [both, customer, partner]
        default: both
      api_url:
        description: API the app talks to
        type: string
        default: https://setu-api.onrender.com
  push:
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.pick.outputs.variants }}
    steps:
      - id: pick
        run: |
          case "${{ inputs.variant || 'both' }}" in
            customer) echo 'variants=["customer"]' >> "$GITHUB_OUTPUT" ;;
            partner)  echo 'variants=["partner"]' >> "$GITHUB_OUTPUT" ;;
            *)        echo 'variants=["customer","partner"]' >> "$GITHUB_OUTPUT" ;;
          esac

  apk:
    name: APK (${{ matrix.variant }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # attach APKs to the release on tag builds
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || 'https://setu-api.onrender.com' }}
      NODE_ENV: production
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Install and build shared packages
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@setu/mobile^..." run build

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Sign with the release key
        if: env.HAS_KEY == 'true'
        working-directory: apps/mobile
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/app/release.keystore
          {
            echo "SETU_STORE_FILE=release.keystore"
            echo "SETU_STORE_PASSWORD=$STORE_PASSWORD"
            echo "SETU_KEY_ALIAS=$KEY_ALIAS"
            echo "SETU_KEY_PASSWORD=$KEY_PASSWORD"
          } >> android/gradle.properties
          python3 scripts/use-release-key.py android/app/build.gradle

      - name: Build the APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the file
        id: name
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          name="abhiyantri-setu-${{ matrix.variant }}-${ref}-${GITHUB_SHA::7}.apk"
          mv apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ matrix.variant }} app"
            echo "- File: \`$name\` ($(du -h "$name" | cut -f1))"
            echo "- API: $EXPO_PUBLIC_API_URL"
            echo "- Signed with: $([ "$HAS_KEY" = true ] && echo 'release key' || echo 'debug key (testing only)')"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.file }}
